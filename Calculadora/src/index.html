<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<meta name="description" content="Calculadora web simples">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e1e1e'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%23ff2e2e'>=</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: #111827;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .calculator-container {
    width: min(92vw, 340px);
  }
  .calculator-display {
    background: #030712;
    border-radius: 0.75rem;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
    min-height: 5.5rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  #history {
    color: #9ca3af;
    font-size: 0.875rem;
    min-height: 1.25rem;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #display {
    color: #fff;
    font-size: 2.25rem;
    font-weight: 600;
    line-height: 1.2;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #display.error {
    color: #f87171;
    font-size: 1.25rem;
  }
  .calculator-button {
    background: #1f2937;
    color: #f9fafb;
    border: none;
    border-radius: 0.75rem;
    padding: 1rem 0;
    font-size: 1.25rem;
    cursor: pointer;
    transition: background-color 0.15s, transform 0.05s;
  }
  .calculator-button:hover {
    background: #374151;
  }
  .calculator-button:active {
    transform: scale(0.96);
  }
  .calculator-button:focus-visible {
    outline: 2px solid #60a5fa;
    outline-offset: 2px;
  }
  .calculator-button.operator {
    background: #374151;
    color: #fbbf24;
  }
  .calculator-button.operator:hover {
    background: #4b5563;
  }
  .calculator-button.danger {
    color: #f87171;
  }
  .calculator-button.equals {
    grid-row: span 2;
    background: #dc2626;
    font-size: 1.5rem;
  }
  .calculator-button.equals:hover {
    background: #ef4444;
  }
</style>
</head>
<body>
<main class="calculator-container bg-gray-800 p-5 rounded-2xl shadow-2xl">
  <div class="calculator-display" role="status" aria-live="polite">
    <div id="history"></div>
    <div id="display">0</div>
  </div>
  <div class="grid grid-cols-4 gap-2">
    <button class="calculator-button danger" aria-label="limpar">C</button>
    <button class="calculator-button operator" aria-label="porcento">%</button>
    <button class="calculator-button operator" aria-label="dividir">÷</button>
    <button class="calculator-button operator" aria-label="apagar último dígito">⌫</button>

    <button class="calculator-button" aria-label="7">7</button>
    <button class="calculator-button" aria-label="8">8</button>
    <button class="calculator-button" aria-label="9">9</button>
    <button class="calculator-button operator" aria-label="multiplicar">×</button>

    <button class="calculator-button" aria-label="4">4</button>
    <button class="calculator-button" aria-label="5">5</button>
    <button class="calculator-button" aria-label="6">6</button>
    <button class="calculator-button operator" aria-label="subtrair">-</button>

    <button class="calculator-button" aria-label="1">1</button>
    <button class="calculator-button" aria-label="2">2</button>
    <button class="calculator-button" aria-label="3">3</button>
    <button class="calculator-button operator" aria-label="somar">+</button>

    <button class="calculator-button" aria-label="0">0</button>
    <button class="calculator-button" aria-label="ponto decimal">.</button>
    <button class="calculator-button" aria-label="inverter sinal">±</button>
    <button class="calculator-button equals" aria-label="igual">=</button>
  </div>
</main>

<script src="js/script.js"></script>

</body>
</html>
