<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<meta name="description" content="Calculadora web simples">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23151821'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%236366f1'>=</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Tokens: um acento (índigo), uma escala de raio (card 20px, resto 14px).
     Tema claro via prefers-color-scheme — sem toggle, a marca não perde nada. */
  :root {
    --page: #eef0f6;
    --case: #ffffff;
    --case-edge: #e2e5ee;
    --screen: #f4f5fa;
    --screen-text: #0b0d12;
    --screen-sub: #5b6376;
    --key: #eef0f6;
    --key-hover: #e2e5ee;
    --key-text: #0b0d12;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-text: #ffffff;
    --danger-text: #b91c1c;
    --error-text: #b91c1c;
    --shadow: 0 24px 48px -16px rgb(11 13 18 / 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0b0d12;
      --case: #151821;
      --case-edge: #232839;
      --screen: #08090d;
      --screen-text: #f5f7fa;
      --screen-sub: #8b93a7;
      --key: #1d2230;
      --key-hover: #2a3042;
      --key-text: #f5f7fa;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-text: #ffffff;
      --danger-text: #f87171;
      --error-text: #f87171;
      --shadow: 0 24px 48px -16px rgb(0 0 0 / 0.7);
    }
  }
  body {
    background: var(--page);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .calculator-container {
    width: min(92vw, 340px);
    background: var(--case);
    border: 1px solid var(--case-edge);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .calculator-display {
    background: var(--screen);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
    min-height: 5.5rem;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  #history {
    color: var(--screen-sub);
    font-size: 0.875rem;
    min-height: 1.25rem;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  #display {
    color: var(--screen-text);
    font-size: clamp(2.5rem, 13vw, 3.25rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  #display.error {
    color: var(--error-text);
    font-size: 1.25rem;
  }
  .calculator-button {
    background: var(--key);
    color: var(--key-text);
    border: none;
    border-radius: 14px;
    padding: 1rem 0;
    font-size: 1.25rem;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background-color 0.15s, transform 0.05s;
  }
  .calculator-button:hover {
    background: var(--key-hover);
  }
  .calculator-button:active, .calculator-button.key-flash {
    transform: scale(0.96);
    background: var(--key-hover);
  }
  .calculator-button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .calculator-button.operator {
    color: var(--accent);
    font-weight: 600;
  }
  .calculator-button.danger {
    color: var(--danger-text);
  }
  .calculator-button.equals {
    grid-row: span 2;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1.5rem;
  }
  .calculator-button.equals:hover, .calculator-button.equals.key-flash {
    background: var(--accent-hover);
  }
  @media (prefers-reduced-motion: reduce) {
    .calculator-button { transition: none; }
    .calculator-button:active, .calculator-button.key-flash { transform: none; }
  }
</style>
</head>
<body>
<main class="calculator-container p-5">
  <div class="calculator-display" role="status" aria-live="polite">
    <div id="history"></div>
    <div id="display">0</div>
  </div>
  <div class="grid grid-cols-4 gap-2">
    <button class="calculator-button danger" aria-label="limpar">C</button>
    <button class="calculator-button operator" aria-label="porcento">%</button>
    <button class="calculator-button operator" aria-label="dividir">÷</button>
    <button class="calculator-button operator" aria-label="apagar último dígito">⌫</button>

    <button class="calculator-button" aria-label="7">7</button>
    <button class="calculator-button" aria-label="8">8</button>
    <button class="calculator-button" aria-label="9">9</button>
    <button class="calculator-button operator" aria-label="multiplicar">×</button>

    <button class="calculator-button" aria-label="4">4</button>
    <button class="calculator-button" aria-label="5">5</button>
    <button class="calculator-button" aria-label="6">6</button>
    <button class="calculator-button operator" aria-label="subtrair">-</button>

    <button class="calculator-button" aria-label="1">1</button>
    <button class="calculator-button" aria-label="2">2</button>
    <button class="calculator-button" aria-label="3">3</button>
    <button class="calculator-button operator" aria-label="somar">+</button>

    <button class="calculator-button" aria-label="0">0</button>
    <button class="calculator-button" aria-label="ponto decimal">.</button>
    <button class="calculator-button" aria-label="inverter sinal">±</button>
    <button class="calculator-button equals" aria-label="igual">=</button>
  </div>
</main>

<script src="js/script.js"></script>

</body>
</html>
